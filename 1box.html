
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Box Model Layout</title>

    <style>

        /* =========================
           BASIC BOX MODEL
        ========================= */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: white;
        }


        /* =========================
           MAIN CONTAINER
        ========================= */

        .container {
            width: 100%;
            min-height: 100vh;

            padding: 8px;
        }


        /* =========================
           HEADER
        ========================= */

        .header {
            width: 100%;
            height: 190px;

            background-color: orangered;

            border: 3px solid white;

            padding: 30px;

            text-align: center;

            color: white;
        }


        .header h1 {
            font-size: 40px;

            margin-bottom: 25px;
        }


        /* =========================
           NAVIGATION
        ========================= */

        .nav {
            width: 70%;

            margin: auto;

            display: flex;

            justify-content: space-around;
        }


        .nav a {
            color: white;

            text-decoration: none;

            font-size: 30px;

            font-weight: bold;
        }


        /* =========================
           CONTENT AREA
        ========================= */

        .content-area {
            width: 100%;

            min-height: 635px;

            display: flex;

            border: 3px solid white;
        }


        /* =========================
           LEFT SECTION
           3 SMALL BOXES + MAIN
        ========================= */

        .left-section {
            width: 75%;

            display: flex;

            flex-direction: column;
        }


        /* =========================
           SMALL BOXES
        ========================= */

        .small-boxes {
            width: 100%;

            height: 285px;

            display: flex;
        }


        .small-box {
            width: 33.33%;

            height: 285px;

            background-color: #19a9e8;

            border: 3px solid white;

            padding: 20px;

            display: flex;

            justify-content: center;

            align-items: center;

            font-size: 30px;

            font-weight: bold;
        }


        /* =========================
           MAIN CONTENT
        ========================= */

        .main-content {
            width: 100%;

            height: 350px;

            background-color: yellow;

            border: 3px solid white;

            padding: 30px;

            display: flex;

            justify-content: center;

            align-items: center;

            font-size: 30px;

            font-weight: bold;
        }


        /* =========================
           SIDE BAR
        ========================= */

        .sidebar {
            width: 25%;

            height: 635px;

            background-color: #42dc72;

            border: 3px solid white;

            padding: 30px;

            display: flex;

            justify-content: center;

            align-items: center;

            font-size: 30px;

            font-weight: bold;
        }


        /* =========================
           FOOTER
        ========================= */

        .footer {
            width: 100%;

            height: 185px;

            background-color: #242ee8;

            border: 3px solid white;

            padding: 30px;

            color: white;

            display: flex;

            justify-content: center;

            align-items: center;

            font-size: 40px;

            font-weight: bold;
        }


        /* =========================
           BOX MODEL DEMONSTRATION
        ========================= */

        /*
            Every box uses:

            width
            height
            padding
            border
            margin

            Example:

            .small-box {
                width: 33.33%;
                height: 285px;
                padding: 20px;
                border: 3px solid white;
            }
        */


    </style>

</head>


<body>


    <div class="container">


        <!-- =========================
             HEADER
        ========================= -->

        <header class="header">

            <h1>Header Element</h1>


            <nav class="nav">

                <a href="#">Home</a>

                <a href="#">About</a>

                <a href="#">Login</a>

            </nav>

        </header>


        <!-- =========================
             CONTENT AREA
        ========================= -->

        <div class="content-area">


            <!-- LEFT SIDE -->

            <div class="left-section">


                <!-- 3 SMALL BOXES -->

                <div class="small-boxes">


                    <div class="small-box">
                        SmallBox1
                    </div>


                    <div class="small-box">
                        SmallBox2
                    </div>


                    <div class="small-box">
                        SmallBox3
                    </div>


                </div>


                <!-- MAIN CONTENT -->

                <div class="main-content">

                    MainContent

                </div>


            </div>


            <!-- RIGHT SIDEBAR -->

            <div class="sidebar">

                Side Bar

            </div>


        </div>


        <!-- =========================
             FOOTER
        ========================= -->

        <footer class="footer">

            Footer

        </footer>


    </div>


</body>

</html>
```
